services:
  node-api:
    build:
      context: ./node-api
    ports:
      - "3000:8080"
    environment:
      PORT: "8080"

  go-api:
    build:
      context: ./go-api
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      NODE_API_URL: "http://node-api:8080"
      CORS_ALLOWED_ORIGINS: "http://localhost:5173"
    depends_on:
      - node-api

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: "http://localhost:8080"
    ports:
      - "5173:80"
    depends_on:
      - go-api
